<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸飞机折叠</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #f5f5dc;
            font-family: sans-serif;
        }

        .scene {
            width: 100%;
            height: 100%;
            position: relative;
            perspective: 1200px;
            perspective-origin: 50% 50%;
            transition: perspective 1s ease-out;
        }

        .plane {
            position: absolute;
            width: 8000px;
            height: 5000px;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            transform:
                translateX(-50%)
                translateY(-50%)
                translateZ(-1200px)
                rotateX(65deg);
            transition: transform 1s ease-out;
        }

        .plane-surface {
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                rgba(173, 216, 230, 1) 0%,
                rgba(173, 216, 230, 0.95) 10%,
                rgba(173, 216, 230, 0.8) 25%,
                rgba(173, 216, 230, 0.5) 45%,
                rgba(173, 216, 230, 0.25) 65%,
                rgba(173, 216, 230, 0) 100%
            );
            position: relative;
        }

        /* 纸张容器 */
        .paper-container {
            position: absolute;
            width: 300px;
            height: 400px;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            transform:
                translateX(-50%)
                translateY(-50%)
                rotateX(-65deg);
            cursor: pointer;
            transition: all 1s ease-out;
        }

        /* 基础纸张 - 会被逐步隐藏 */
        .base-paper {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ffffff;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.2),
                0 8px 20px rgba(0, 0, 0, 0.15);
            transition: opacity 0.5s ease-out;
        }

        /* 纸飞机3D模型容器 */
        .airplane {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }

        .airplane.visible {
            opacity: 1;
        }

        /* 机身中心 */
        .fuselage {
            position: absolute;
            width: 40px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            background: #ffffff;
            transform-style: preserve-3d;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* 左半部分 */
        .left-half {
            position: absolute;
            width: 50%;
            height: 100%;
            left: 0;
            top: 0;
            transform-origin: right center;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
        }

        /* 右半部分 */
        .right-half {
            position: absolute;
            width: 50%;
            height: 100%;
            right: 0;
            top: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
        }

        /* 左上三角折叠区 */
        .top-left-fold {
            position: absolute;
            width: 100%;
            height: 40%;
            left: 0;
            top: 0;
            background: #ffffff;
            transform-origin: bottom right;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.15);
        }

        /* 右上三角折叠区 */
        .top-right-fold {
            position: absolute;
            width: 100%;
            height: 40%;
            right: 0;
            top: 0;
            background: #ffffff;
            transform-origin: bottom left;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(0 0, 100% 0, 0 100%);
            box-shadow: -2px 2px 8px rgba(0, 0, 0, 0.15);
        }

        /* 左翼 */
        .left-wing {
            position: absolute;
            width: 100%;
            height: 60%;
            left: 0;
            top: 0;
            background: #ffffff;
            transform-origin: right center;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.18);
        }

        /* 右翼 */
        .right-wing {
            position: absolute;
            width: 100%;
            height: 60%;
            right: 0;
            top: 0;
            background: #ffffff;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -2px 4px 12px rgba(0, 0, 0, 0.18);
        }

        /* 中线折痕 */
        .center-line {
            position: absolute;
            width: 2px;
            height: 100%;
            left: 50%;
            top: 0;
            background: rgba(180, 180, 180, 0.4);
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.5s ease-out;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.1);
        }

        /* UI */
        .step-indicator {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-size: 18px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 28px;
            border-radius: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .hint {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-size: 20px;
            text-align: center;
            opacity: 0.9;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        body.completed .hint {
            font-size: 24px;
            color: #4CAF50;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="step-indicator">
        <span id="step">0</span> / 7 步
    </div>
    <div class="hint" id="hint">点击白纸开始折叠纸飞机</div>

    <div class="scene" id="scene">
        <div class="plane" id="plane">
            <div class="plane-surface">
                <div class="paper-container" id="paperContainer">
                    <!-- 基础纸张 -->
                    <div class="base-paper" id="basePaper">
                        <div class="center-line" id="centerLine"></div>
                    </div>

                    <!-- 纸飞机模型 -->
                    <div class="airplane" id="airplane">
                        <!-- 左半部分 -->
                        <div class="left-half" id="leftHalf">
                            <div class="top-left-fold" id="topLeftFold"></div>
                            <div class="left-wing" id="leftWing"></div>
                        </div>

                        <!-- 右半部分 -->
                        <div class="right-half" id="rightHalf">
                            <div class="top-right-fold" id="topRightFold"></div>
                            <div class="right-wing" id="rightWing"></div>
                        </div>

                        <!-- 机身中心 -->
                        <div class="fuselage" id="fuselage"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        const totalSteps = 7;
        let isAnimating = false;

        const el = {
            scene: document.getElementById('scene'),
            plane: document.getElementById('plane'),
            container: document.getElementById('paperContainer'),
            basePaper: document.getElementById('basePaper'),
            airplane: document.getElementById('airplane'),
            centerLine: document.getElementById('centerLine'),
            leftHalf: document.getElementById('leftHalf'),
            rightHalf: document.getElementById('rightHalf'),
            topLeftFold: document.getElementById('topLeftFold'),
            topRightFold: document.getElementById('topRightFold'),
            leftWing: document.getElementById('leftWing'),
            rightWing: document.getElementById('rightWing'),
            fuselage: document.getElementById('fuselage'),
            hint: document.getElementById('hint'),
            stepDisplay: document.getElementById('step')
        };

        const hints = [
            '点击白纸开始折叠纸飞机',
            '对折建立中线',
            '左上角向中线折叠',
            '右上角向中线折叠',
            '左侧再次向中线折叠',
            '右侧再次向中线折叠',
            '整体沿中线对折',
            '展开机翼完成纸飞机！'
        ];

        function updateUI() {
            el.hint.textContent = currentStep < totalSteps ? hints[currentStep + 1] : '纸飞机折叠完成！✈️';
            el.stepDisplay.textContent = currentStep;
            if (currentStep === totalSteps) {
                document.body.classList.add('completed');
            }
        }

        function zoomCamera() {
            const progress = currentStep / totalSteps;
            const perspective = 1200 - (700 * progress);
            const translateZ = -1200 + (900 * progress);
            const rotateX = 65 - (25 * progress);

            el.scene.style.perspective = `${perspective}px`;
            el.plane.style.transform = `
                translateX(-50%)
                translateY(-50%)
                translateZ(${translateZ}px)
                rotateX(${rotateX}deg)
            `;
        }

        function fold() {
            if (currentStep >= totalSteps || isAnimating) return;

            isAnimating = true;
            currentStep++;
            zoomCamera();

            switch(currentStep) {
                case 1: // 对折建立中线
                    el.centerLine.style.opacity = '1';
                    el.basePaper.style.transform = 'scaleX(0.5)';
                    setTimeout(() => {
                        el.basePaper.style.transform = 'scaleX(1)';
                    }, 400);
                    break;

                case 2: // 左上角折向中线
                    el.basePaper.style.opacity = '0.3';
                    el.airplane.classList.add('visible');
                    el.topLeftFold.style.transform = 'rotateZ(90deg) translateY(-50%)';
                    break;

                case 3: // 右上角折向中线
                    el.topRightFold.style.transform = 'rotateZ(-90deg) translateY(-50%)';
                    break;

                case 4: // 左侧再次折向中线
                    el.basePaper.style.opacity = '0';
                    el.leftHalf.style.transform = 'rotateY(0deg)';
                    el.topLeftFold.style.transform = 'rotateZ(90deg) rotateY(180deg) translateY(-50%)';
                    break;

                case 5: // 右侧再次折向中线
                    el.rightHalf.style.transform = 'rotateY(0deg)';
                    el.topRightFold.style.transform = 'rotateZ(-90deg) rotateY(-180deg) translateY(-50%)';
                    break;

                case 6: // 整体沿中线对折
                    el.leftHalf.style.transform = 'rotateY(85deg)';
                    el.rightHalf.style.transform = 'rotateY(-85deg)';
                    el.fuselage.style.opacity = '1';
                    el.container.style.transform = `
                        translateX(-50%)
                        translateY(-50%)
                        rotateX(-65deg)
                        scale(0.9)
                    `;
                    break;

                case 7: // 展开机翼
                    el.leftWing.style.transform = 'rotateY(-20deg) translateZ(5px)';
                    el.rightWing.style.transform = 'rotateY(20deg) translateZ(5px)';
                    el.leftHalf.style.transform = 'rotateY(0deg)';
                    el.rightHalf.style.transform = 'rotateY(0deg)';

                    setTimeout(() => {
                        el.container.style.transform = `
                            translateX(-50%)
                            translateY(-50%)
                            rotateX(-50deg)
                            rotateY(-10deg)
                            rotateZ(-8deg)
                            scale(0.85)
                        `;
                    }, 300);
                    break;
            }

            updateUI();
            setTimeout(() => { isAnimating = false; }, 1000);
        }

        el.container.addEventListener('click', (e) => {
            e.stopPropagation();
            fold();
        });

        updateUI();
    </script>
</body>
</html>
