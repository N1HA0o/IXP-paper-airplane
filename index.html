<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸飞机的旅程</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            font-family: sans-serif;
        }

        .scene {
            width: 100%;
            height: 100%;
            position: relative;
            perspective: 1200px;
            perspective-origin: 50% 50%;
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .world {
            position: absolute;
            width: 8000px;
            height: 5000px;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            transform:
                translateX(-50%)
                translateY(-50%)
                translateZ(-1200px)
                rotateX(65deg);
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ground {
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                rgba(173, 216, 230, 1) 0%,
                rgba(173, 216, 230, 0.95) 10%,
                rgba(173, 216, 230, 0.8) 25%,
                rgba(173, 216, 230, 0.5) 45%,
                rgba(173, 216, 230, 0.25) 65%,
                rgba(173, 216, 230, 0) 100%
            );
            position: relative;
        }

        /* 纸张容器 */
        .paper-container {
            position: absolute;
            width: 300px;
            height: 400px;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            transform:
                translateX(-50%)
                translateY(-50%)
                rotateX(-65deg);
            cursor: pointer;
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 基础白纸 */
        .paper {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ffffff;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.2),
                0 8px 20px rgba(0, 0, 0, 0.15);
            transition: opacity 0.8s ease-out;
        }

        /* 纸飞机 */
        .airplane {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            opacity: 0;
            transition: opacity 0.8s ease-out;
        }

        .airplane.visible {
            opacity: 1;
        }

        .plane-body-left {
            position: absolute;
            width: 50%;
            height: 100%;
            left: 0;
            top: 0;
            background: #ffffff;
            transform-origin: right center;
            transform: rotateY(75deg);
            transform-style: preserve-3d;
            box-shadow: 2px 4px 15px rgba(0, 0, 0, 0.2);
            clip-path: polygon(20% 0, 100% 30%, 100% 100%, 0 100%, 0 0);
        }

        .plane-body-right {
            position: absolute;
            width: 50%;
            height: 100%;
            right: 0;
            top: 0;
            background: #ffffff;
            transform-origin: left center;
            transform: rotateY(-75deg);
            transform-style: preserve-3d;
            box-shadow: -2px 4px 15px rgba(0, 0, 0, 0.2);
            clip-path: polygon(0 30%, 80% 0, 100% 0, 100% 100%, 0 100%);
        }

        .plane-center {
            position: absolute;
            width: 30px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        /* 选择按钮 */
        .choice-buttons {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            gap: 40px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }

        .choice-buttons.visible {
            display: flex;
            opacity: 1;
        }

        .choice-btn {
            padding: 20px 50px;
            font-size: 24px;
            font-weight: 600;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .choice-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        .choice-btn.left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .choice-btn.right {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        /* 白鸽群 */
        .pigeons {
            position: absolute;
            left: -800px;
            top: 30%;
            transform-style: preserve-3d;
            opacity: 0;
            transition: all 3s ease-out;
        }

        .pigeons.visible {
            opacity: 1;
            left: 40%;
        }

        .pigeon {
            position: absolute;
            width: 40px;
            height: 30px;
            background: white;
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            animation: fly 2s ease-in-out infinite;
        }

        .pigeon::before,
        .pigeon::after {
            content: '';
            position: absolute;
            width: 35px;
            height: 12px;
            background: white;
            border-radius: 50%;
            top: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .pigeon::before {
            left: -30px;
            transform-origin: right center;
            animation: wing-left 0.5s ease-in-out infinite;
        }

        .pigeon::after {
            right: -30px;
            transform-origin: left center;
            animation: wing-right 0.5s ease-in-out infinite;
        }

        @keyframes fly {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes wing-left {
            0%, 100% { transform: rotateZ(-10deg); }
            50% { transform: rotateZ(-30deg); }
        }

        @keyframes wing-right {
            0%, 100% { transform: rotateZ(10deg); }
            50% { transform: rotateZ(30deg); }
        }

        /* 热气球 */
        .hot-air-balloon {
            position: absolute;
            right: -600px;
            top: 20%;
            transform-style: preserve-3d;
            opacity: 0;
            transition: all 3s ease-out;
        }

        .hot-air-balloon.visible {
            opacity: 1;
            right: 35%;
        }

        .balloon-envelope {
            position: relative;
            width: 180px;
            height: 220px;
            background: linear-gradient(135deg,
                #ff6b6b 0%,
                #ff8787 25%,
                #ffd93d 50%,
                #6bcf7f 75%,
                #4d96ff 100%);
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        .balloon-basket {
            position: absolute;
            width: 60px;
            height: 50px;
            background: #8B4513;
            border-radius: 0 0 10px 10px;
            left: 50%;
            top: 100%;
            transform: translateX(-50%);
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .balloon-rope {
            position: absolute;
            width: 2px;
            height: 25px;
            background: #654321;
            left: 50%;
            top: 100%;
            transform: translateX(-50%);
        }

        .balloon-rope:nth-child(2) {
            left: 30%;
        }

        .balloon-rope:nth-child(3) {
            left: 70%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* 提示文字 */
        .hint {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #333;
            font-size: 20px;
            text-align: center;
            opacity: 0.9;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
            transition: opacity 0.5s;
        }

        /* 场景描述 */
        .scene-description {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.9);
            transition: opacity 1s ease-out;
            z-index: 50;
        }

        .scene-description.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="hint" id="hint">点击白纸，开始纸飞机的旅程</div>
    <div class="scene-description" id="sceneDesc"></div>

    <div class="choice-buttons" id="choiceButtons">
        <button class="choice-btn left" id="flyLeft">← 向左飞</button>
        <button class="choice-btn right" id="flyRight">向右飞 →</button>
    </div>

    <div class="scene" id="scene">
        <div class="world" id="world">
            <div class="ground">
                <!-- 白纸和纸飞机 -->
                <div class="paper-container" id="paperContainer">
                    <div class="paper" id="paper"></div>
                    <div class="airplane" id="airplane">
                        <div class="plane-body-left"></div>
                        <div class="plane-body-right"></div>
                        <div class="plane-center"></div>
                    </div>
                </div>

                <!-- 白鸽群 -->
                <div class="pigeons" id="pigeons">
                    <!-- 动态生成多只白鸽 -->
                </div>

                <!-- 热气球 -->
                <div class="hot-air-balloon" id="balloon">
                    <div class="balloon-envelope">
                        <div class="balloon-rope"></div>
                        <div class="balloon-rope"></div>
                        <div class="balloon-rope"></div>
                    </div>
                    <div class="balloon-basket"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let gameState = 'initial'; // initial, folded, flying

        const el = {
            scene: document.getElementById('scene'),
            world: document.getElementById('world'),
            container: document.getElementById('paperContainer'),
            paper: document.getElementById('paper'),
            airplane: document.getElementById('airplane'),
            hint: document.getElementById('hint'),
            choiceButtons: document.getElementById('choiceButtons'),
            flyLeft: document.getElementById('flyLeft'),
            flyRight: document.getElementById('flyRight'),
            pigeons: document.getElementById('pigeons'),
            balloon: document.getElementById('balloon'),
            sceneDesc: document.getElementById('sceneDesc')
        };

        // 创建白鸽群
        function createPigeons() {
            const positions = [
                { x: 0, y: 0, delay: 0 },
                { x: 80, y: -30, delay: 0.2 },
                { x: -70, y: 20, delay: 0.1 },
                { x: 150, y: 10, delay: 0.3 },
                { x: -140, y: -20, delay: 0.15 },
                { x: 60, y: 60, delay: 0.25 },
                { x: -50, y: -60, delay: 0.05 }
            ];

            positions.forEach(pos => {
                const pigeon = document.createElement('div');
                pigeon.className = 'pigeon';
                pigeon.style.left = pos.x + 'px';
                pigeon.style.top = pos.y + 'px';
                pigeon.style.animationDelay = pos.delay + 's';
                el.pigeons.appendChild(pigeon);
            });
        }

        // 折叠纸飞机
        function foldPaper() {
            if (gameState !== 'initial') return;
            gameState = 'folded';

            el.hint.style.opacity = '0';

            // 纸张淡出，纸飞机淡入
            setTimeout(() => {
                el.paper.style.opacity = '0';
                el.airplane.classList.add('visible');
            }, 200);

            // 视角拉近
            setTimeout(() => {
                el.scene.style.perspective = '600px';
                el.world.style.transform = `
                    translateX(-50%)
                    translateY(-50%)
                    translateZ(-400px)
                    rotateX(50deg)
                `;
            }, 800);

            // 显示选择按钮
            setTimeout(() => {
                el.hint.textContent = '选择纸飞机的飞行方向';
                el.hint.style.opacity = '0.9';
                el.choiceButtons.classList.add('visible');
            }, 2500);
        }

        // 向左飞 - 遇见白鸽
        function flyLeft() {
            if (gameState !== 'folded') return;
            gameState = 'flying';

            el.choiceButtons.classList.remove('visible');
            el.hint.style.opacity = '0';

            // 纸飞机向左飞行
            el.container.style.transform = `
                translateX(-150%)
                translateY(-50%)
                rotateX(-50deg)
                rotateY(-30deg)
                rotateZ(-15deg)
                scale(0.7)
            `;

            // 镜头跟随并转向左侧
            el.world.style.transform = `
                translateX(-30%)
                translateY(-50%)
                translateZ(-200px)
                rotateX(45deg)
                rotateY(20deg)
            `;

            // 显示白鸽群
            setTimeout(() => {
                el.pigeons.classList.add('visible');
                el.sceneDesc.textContent = '一群白鸽从远处飞来，与纸飞机一起翱翔';
                el.sceneDesc.classList.add('visible');
            }, 1500);

            setTimeout(() => {
                el.sceneDesc.style.opacity = '0';
            }, 5000);
        }

        // 向右飞 - 遇见热气球
        function flyRight() {
            if (gameState !== 'folded') return;
            gameState = 'flying';

            el.choiceButtons.classList.remove('visible');
            el.hint.style.opacity = '0';

            // 纸飞机向右飞行
            el.container.style.transform = `
                translateX(50%)
                translateY(-50%)
                rotateX(-50deg)
                rotateY(30deg)
                rotateZ(15deg)
                scale(0.7)
            `;

            // 镜头跟随并转向右侧
            el.world.style.transform = `
                translateX(-70%)
                translateY(-50%)
                translateZ(-200px)
                rotateX(45deg)
                rotateY(-20deg)
            `;

            // 显示热气球
            setTimeout(() => {
                el.balloon.classList.add('visible');
                el.sceneDesc.textContent = '一个五彩缤纷的热气球出现在视野中';
                el.sceneDesc.classList.add('visible');
            }, 1500);

            setTimeout(() => {
                el.sceneDesc.style.opacity = '0';
            }, 5000);
        }

        // 事件监听
        el.container.addEventListener('click', foldPaper);
        el.flyLeft.addEventListener('click', flyLeft);
        el.flyRight.addEventListener('click', flyRight);

        // 初始化
        createPigeons();
    </script>
</body>
</html>
