<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸飞机折叠</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #f5f5dc;
            font-family: sans-serif;
        }

        .scene {
            width: 100%;
            height: 100%;
            position: relative;
            perspective: 1200px;
            perspective-origin: 50% 50%;
            transition: perspective 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 超大平面 - 左右充满屏幕 */
        .plane {
            position: absolute;
            width: 8000px;
            height: 5000px;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            transform:
                translateX(-50%)
                translateY(-50%)
                translateZ(-1200px)
                rotateX(65deg);
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .plane-surface {
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                rgba(173, 216, 230, 1) 0%,
                rgba(173, 216, 230, 0.95) 10%,
                rgba(173, 216, 230, 0.8) 25%,
                rgba(173, 216, 230, 0.5) 45%,
                rgba(173, 216, 230, 0.25) 65%,
                rgba(173, 216, 230, 0) 100%
            );
            position: relative;
        }

        /* 纸张容器 */
        .paper-wrapper {
            position: absolute;
            width: 320px;
            height: 440px;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            transform:
                translateX(-50%)
                translateY(-50%)
                rotateX(-65deg);
            cursor: pointer;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 主纸张 */
        .paper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            background: #ffffff;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.2),
                0 10px 25px rgba(0, 0, 0, 0.15),
                inset 0 0 0 1px rgba(0, 0, 0, 0.02);
        }

        /* 纸张层次 - 用于创建厚度感 */
        .paper::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg,
                rgba(0,0,0,0.03) 0%,
                transparent 50%,
                rgba(255,255,255,0.3) 100%);
            pointer-events: none;
        }

        /* 中线折痕 */
        .center-crease {
            position: absolute;
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
            background: linear-gradient(to bottom,
                rgba(180, 180, 180, 0) 0%,
                rgba(180, 180, 180, 0.4) 20%,
                rgba(180, 180, 180, 0.4) 80%,
                rgba(180, 180, 180, 0) 100%
            );
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.6s ease-out;
            box-shadow: 0 0 2px rgba(0,0,0,0.1);
        }

        /* 左半部分 */
        .half-left {
            position: absolute;
            width: 50%;
            height: 100%;
            left: 0;
            top: 0;
            background: #ffffff;
            transform-origin: right center;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
        }

        /* 右半部分 */
        .half-right {
            position: absolute;
            width: 50%;
            height: 100%;
            right: 0;
            top: 0;
            background: #ffffff;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -2px 0 8px rgba(0,0,0,0.08);
        }

        /* 左上角三角形区域 */
        .corner-left {
            position: absolute;
            width: 50%;
            height: 35%;
            left: 0;
            top: 0;
            background: #ffffff;
            transform-origin: right top;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 0);
            box-shadow: 2px 2px 10px rgba(0,0,0,0.12);
        }

        /* 右上角三角形区域 */
        .corner-right {
            position: absolute;
            width: 50%;
            height: 35%;
            right: 0;
            top: 0;
            background: #ffffff;
            transform-origin: left top;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(0 0, 100% 0, 100% 0, 0 100%);
            box-shadow: -2px 2px 10px rgba(0,0,0,0.12);
        }

        /* 左翼 */
        .wing-left {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            background: #ffffff;
            transform-origin: bottom center;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 右翼 */
        .wing-right {
            position: absolute;
            width: 100%;
            height: 100%;
            right: 0;
            top: 0;
            background: #ffffff;
            transform-origin: bottom center;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 折痕效果 */
        .crease {
            position: absolute;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(150, 150, 150, 0.3) 50%,
                transparent 100%
            );
            opacity: 0;
            transition: opacity 0.6s ease-out;
        }

        .crease-diagonal-left {
            width: 100%;
            height: 2px;
            top: 0;
            left: 0;
            transform-origin: top left;
            transform: rotate(35deg);
        }

        .crease-diagonal-right {
            width: 100%;
            height: 2px;
            top: 0;
            right: 0;
            transform-origin: top right;
            transform: rotate(-35deg);
        }

        /* UI元素 */
        .step-indicator {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-size: 18px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 28px;
            border-radius: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .hint {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-size: 20px;
            text-align: center;
            opacity: 0.9;
            pointer-events: none;
            transition: opacity 0.5s;
            text-shadow: 0 2px 4px rgba(255,255,255,0.8);
            max-width: 80%;
        }

        /* 完成状态 */
        .completed .hint {
            font-size: 24px;
            color: #4CAF50;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="step-indicator">
        <span id="step">0</span> / 8 步
    </div>
    <div class="hint" id="hint">点击白纸开始折叠纸飞机</div>

    <div class="scene" id="scene">
        <div class="plane" id="plane">
            <div class="plane-surface">
                <div class="paper-wrapper" id="paperWrapper">
                    <div class="paper" id="paper">
                        <div class="center-crease"></div>

                        <!-- 第一层：左右半部分（用于最后的中线对折） -->
                        <div class="half-left" id="halfLeft">
                            <!-- 左上角折叠 -->
                            <div class="corner-left" id="cornerLeft">
                                <div class="crease crease-diagonal-left" id="creaseLeft"></div>
                            </div>
                            <!-- 左翼 -->
                            <div class="wing-left" id="wingLeft"></div>
                        </div>

                        <div class="half-right" id="halfRight">
                            <!-- 右上角折叠 -->
                            <div class="corner-right" id="cornerRight">
                                <div class="crease crease-diagonal-right" id="creaseRight"></div>
                            </div>
                            <!-- 右翼 -->
                            <div class="wing-right" id="wingRight"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        const totalSteps = 8;
        let isAnimating = false;

        const elements = {
            scene: document.getElementById('scene'),
            plane: document.getElementById('plane'),
            wrapper: document.getElementById('paperWrapper'),
            paper: document.getElementById('paper'),
            hint: document.getElementById('hint'),
            step: document.getElementById('step'),
            centerCrease: document.querySelector('.center-crease'),
            halfLeft: document.getElementById('halfLeft'),
            halfRight: document.getElementById('halfRight'),
            cornerLeft: document.getElementById('cornerLeft'),
            cornerRight: document.getElementById('cornerRight'),
            wingLeft: document.getElementById('wingLeft'),
            wingRight: document.getElementById('wingRight'),
            creaseLeft: document.getElementById('creaseLeft'),
            creaseRight: document.getElementById('creaseRight')
        };

        // 每步的提示文字
        const hints = [
            '点击白纸开始折叠纸飞机',
            '建立中线折痕',
            '左上角向中线折叠',
            '右上角向中线折叠',
            '左侧再次向中线折叠',
            '右侧再次向中线折叠',
            '整体沿中线对折',
            '展开左侧机翼',
            '展开右侧机翼 - 完成！'
        ];

        // 更新UI
        function updateUI() {
            elements.hint.textContent = currentStep < totalSteps ? hints[currentStep + 1] : '纸飞机折叠完成！✈️';
            elements.step.textContent = currentStep;

            if (currentStep === totalSteps) {
                document.body.classList.add('completed');
            }
        }

        // 视角靠近效果 - 每步递进
        function zoomCamera() {
            // perspective: 1200 -> 400
            // translateZ: -1200 -> -200
            // rotateX: 65 -> 35
            const progress = currentStep / totalSteps;

            const perspective = 1200 - (800 * progress);
            const translateZ = -1200 + (1000 * progress);
            const rotateX = 65 - (30 * progress);
            const scale = 1 + (0.3 * progress); // 纸张逐渐变大

            elements.scene.style.perspective = `${perspective}px`;
            elements.plane.style.transform = `
                translateX(-50%)
                translateY(-50%)
                translateZ(${translateZ}px)
                rotateX(${rotateX}deg)
            `;
        }

        // 执行折叠动画
        function fold() {
            if (currentStep >= totalSteps || isAnimating) return;

            isAnimating = true;
            currentStep++;

            // 视角靠近
            zoomCamera();

            // 根据步骤执行不同的折叠
            switch(currentStep) {
                case 1: // 建立中线（对折后展开）
                    elements.centerCrease.style.opacity = '1';
                    // 模拟快速对折再展开
                    elements.halfLeft.style.transform = 'rotateY(90deg)';
                    setTimeout(() => {
                        elements.halfLeft.style.transform = 'rotateY(0deg)';
                    }, 300);
                    break;

                case 2: // 左上角折向中线
                    elements.creaseLeft.style.opacity = '1';
                    elements.cornerLeft.style.transform = 'rotateZ(-25deg) rotateY(90deg) translateX(10px)';
                    break;

                case 3: // 右上角折向中线
                    elements.creaseRight.style.opacity = '1';
                    elements.cornerRight.style.transform = 'rotateZ(25deg) rotateY(-90deg) translateX(-10px)';
                    break;

                case 4: // 左侧二次折叠（形成尖机头）
                    elements.halfLeft.style.transform = 'rotateY(45deg) translateZ(8px)';
                    elements.cornerLeft.style.transform = 'rotateZ(-25deg) rotateY(135deg) translateX(15px) translateZ(5px)';
                    break;

                case 5: // 右侧二次折叠
                    elements.halfRight.style.transform = 'rotateY(-45deg) translateZ(8px)';
                    elements.cornerRight.style.transform = 'rotateZ(25deg) rotateY(-135deg) translateX(-15px) translateZ(5px)';
                    break;

                case 6: // 整体沿中线对折
                    elements.wrapper.style.transform = `
                        translateX(-50%)
                        translateY(-50%)
                        rotateX(-65deg)
                        rotateY(5deg)
                        scale(0.9)
                    `;
                    elements.halfLeft.style.transform = 'rotateY(80deg) translateZ(15px)';
                    elements.halfRight.style.transform = 'rotateY(-80deg) translateZ(15px)';
                    elements.cornerLeft.style.transform = 'rotateZ(-25deg) rotateY(170deg) translateX(20px) translateZ(10px)';
                    elements.cornerRight.style.transform = 'rotateZ(25deg) rotateY(-170deg) translateX(-20px) translateZ(10px)';
                    break;

                case 7: // 展开左翼
                    elements.wingLeft.style.transform = 'rotateX(-35deg) translateY(20px) translateZ(5px)';
                    elements.halfLeft.style.transform = 'rotateY(70deg) translateZ(15px)';
                    break;

                case 8: // 展开右翼 - 完成纸飞机
                    elements.wingRight.style.transform = 'rotateX(-35deg) translateY(20px) translateZ(5px)';
                    elements.halfRight.style.transform = 'rotateY(-70deg) translateZ(15px)';

                    // 最终姿态调整
                    setTimeout(() => {
                        elements.wrapper.style.transform = `
                            translateX(-50%)
                            translateY(-50%)
                            rotateX(-50deg)
                            rotateY(0deg)
                            rotateZ(-5deg)
                            scale(0.85)
                        `;
                    }, 400);
                    break;
            }

            updateUI();

            // 动画完成后允许下次点击
            setTimeout(() => {
                isAnimating = false;
            }, 1200);
        }

        // 点击事件
        elements.wrapper.addEventListener('click', (e) => {
            e.stopPropagation();
            fold();
        });

        // 初始化
        updateUI();
    </script>
</body>
</html>
