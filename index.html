<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对峙 - Confrontation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
            font-family: monospace;
        }

        .scene {
            width: 100%;
            height: 100%;
            position: relative;
            perspective: 1400px;
            perspective-origin: 50% 35%;
        }

        /* 3D桌子 - 更大，有明显高度 */
        .table-3d {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%) rotateX(77deg);
            transform-style: preserve-3d;
        }

        .table-top {
            width: 700px;
            height: 400px;
            background: #1a5c3a;
            border-radius: 200px / 200px;
            position: relative;
            box-shadow:
                inset 0 0 40px rgba(0, 0, 0, 0.4),
                0 30px 60px rgba(0, 0, 0, 0.9);
        }

        /* 桌子表面细节 */
        .table-top::before {
            content: '';
            position: absolute;
            inset: 15px;
            background: #1e6b42;
            border-radius: 185px / 185px;
            box-shadow: inset 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* 桌子边缘厚度（3D高度） */
        .table-edge {
            position: absolute;
            width: 700px;
            height: 400px;
            border-radius: 200px / 200px;
            background: linear-gradient(to bottom, #143d22, #0a2415);
            transform: translateZ(-40px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .table-side {
            position: absolute;
            background: #0f3520;
            transform-style: preserve-3d;
        }

        .table-side.front {
            width: 700px;
            height: 40px;
            bottom: -40px;
            border-radius: 0 0 200px 200px / 0 0 100px 100px;
        }

        /* 桌腿 */
        .table-leg {
            position: absolute;
            width: 35px;
            height: 120px;
            background: linear-gradient(to bottom, #0d3320, #051a10);
            transform-style: preserve-3d;
            transform: translateZ(-40px) translateY(40px);
            box-shadow: -6px 0 12px rgba(0, 0, 0, 0.6);
        }

        .table-leg.front-left {
            bottom: -160px;
            left: 130px;
        }

        .table-leg.front-right {
            bottom: -160px;
            right: 130px;
        }

        /* 像素画容器 */
        .pixel-canvas {
            position: absolute;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* 对面人物像素画 */
        .opposite-character {
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 480px;
        }

        /* 玩家手部 - 在桌子上 */
        .player-hands-container {
            position: absolute;
            top: 42%;
            left: 0;
            right: 0;
            height: 58%;
            pointer-events: none;
        }

        .player-hand {
            position: absolute;
            top: 0;
        }

        .player-hand.left {
            left: 15%;
        }

        .player-hand.right {
            right: 15%;
        }
    </style>
</head>
<body>
    <div class="scene">
        <!-- 对面人物像素画 -->
        <canvas id="oppositeChar" class="pixel-canvas opposite-character" width="200" height="240"></canvas>

        <!-- 3D桌子 -->
        <div class="table-3d">
            <div class="table-edge"></div>
            <div class="table-top">
                <!-- 左轮手枪像素画 -->
                <canvas id="revolverCanvas" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotateX(-77deg); image-rendering: pixelated;" width="100" height="50"></canvas>
            </div>
            <div class="table-leg front-left"></div>
            <div class="table-leg front-right"></div>
        </div>

        <!-- 玩家手部 -->
        <div class="player-hands-container">
            <canvas id="leftHand" class="pixel-canvas player-hand left" width="180" height="280"></canvas>
            <canvas id="rightHand" class="pixel-canvas player-hand right" width="180" height="280"></canvas>
        </div>
    </div>

    <script>
        // 像素尺寸
        const PIXEL_SIZE = 2;

        // 绘制矩形区域
        function drawRect(ctx, x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }

        // 绘制圆形
        function drawCircle(ctx, x, y, radius, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        // 绘制椭圆
        function drawEllipse(ctx, x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // ===== 绘制对面人物（更有机的设计）=====
        function drawOppositeCharacter() {
            const canvas = document.getElementById('oppositeChar');
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // === 帽子 ===
            // 帽子顶部（圆润）
            drawEllipse(ctx, 100, 35, 32, 18, '#1a1a1a');
            drawRect(ctx, 68, 35, 64, 15, '#1a1a1a');

            // 帽子细节和折痕
            drawEllipse(ctx, 100, 38, 28, 14, '#252525');
            drawRect(ctx, 72, 38, 56, 12, '#252525');

            // 帽檐（有弧度）
            for(let x = 0; x < 80; x++) {
                const curve = Math.sin((x / 80) * Math.PI) * 2;
                drawRect(ctx, 60 + x, 50 + curve, 1, 5, '#1f1f1f');
            }
            drawRect(ctx, 60, 52, 80, 4, '#0d0d0d');

            // === 头部（圆润的脸型）===
            // 脸部轮廓（椭圆形，被帽子部分遮挡）
            drawEllipse(ctx, 100, 75, 24, 28, '#4a4543');

            // 脸部基础色（略浅）
            drawEllipse(ctx, 100, 77, 22, 26, '#524f4a');

            // 帽子对脸部的阴影（帽檐下方）
            for(let y = 56; y < 68; y++) {
                const alpha = (y - 56) / 12;
                ctx.globalAlpha = 0.6 - alpha * 0.4;
                drawEllipse(ctx, 100, 75, 22, 26, '#1a1a1a');
            }
            ctx.globalAlpha = 1;

            // 隐约可见的五官
            // 左眼（模糊）
            drawEllipse(ctx, 90, 72, 3, 2, '#2a2826');
            drawRect(ctx, 88, 71, 4, 2, '#1a1816');

            // 右眼（模糊）
            drawEllipse(ctx, 110, 72, 3, 2, '#2a2826');
            drawRect(ctx, 108, 71, 4, 2, '#1a1816');

            // 鼻子（非常隐约）
            drawRect(ctx, 99, 78, 2, 4, '#3d3a38');

            // === 脸上的血迹（自然流淌）===
            // 左侧血迹
            const bloodY1 = 75;
            for(let i = 0; i < 15; i++) {
                const y = bloodY1 + i;
                const width = 2 + Math.sin(i * 0.5) * 1;
                const x = 92 + Math.sin(i * 0.8) * 0.5;
                ctx.globalAlpha = 0.7 + Math.sin(i) * 0.2;
                drawRect(ctx, x, y, width, 1, i % 3 === 0 ? '#5a1818' : '#4a1010');
            }
            ctx.globalAlpha = 1;

            // 右侧血迹
            drawEllipse(ctx, 112, 76, 2, 4, '#4a1010');
            drawRect(ctx, 111, 78, 3, 6, '#3d0d0d');
            drawRect(ctx, 112, 82, 2, 4, '#5a1818');

            // === 颈部（自然过渡）===
            // 下巴到颈部的圆润过渡
            drawEllipse(ctx, 100, 103, 16, 8, '#4a4543');
            drawRect(ctx, 84, 103, 32, 10, '#4a4543');

            // 颈部阴影
            drawRect(ctx, 88, 105, 24, 3, '#3d3a38');

            // === 绿色卫衣（有机形状）===
            // 肩部（圆润）
            drawEllipse(ctx, 70, 125, 18, 15, '#2d5016');
            drawEllipse(ctx, 130, 125, 18, 15, '#2d5016');

            // 身体主体（略微梯形，更自然）
            for(let y = 0; y < 100; y++) {
                const width = 68 + Math.sin(y * 0.1) * 3;
                const x = 100 - width / 2;
                drawRect(ctx, x, 118 + y, width, 1, '#2d5016');
            }

            // 卫衣帽兜边缘
            for(let x = 0; x < 56; x++) {
                const curve = Math.sin((x / 56) * Math.PI) * 2;
                drawRect(ctx, 72 + x, 118 + curve, 1, 1, '#243d12');
            }

            // 卫衣褶皱和阴影（左侧）
            for(let y = 0; y < 95; y++) {
                const alpha = 0.3 + Math.sin(y * 0.2) * 0.1;
                ctx.globalAlpha = alpha;
                drawRect(ctx, 66, 120 + y, 12, 1, '#1f3310');
            }
            ctx.globalAlpha = 1;

            // 卫衣褶皱和阴影（右侧）
            for(let y = 0; y < 95; y++) {
                const alpha = 0.3 + Math.sin(y * 0.2) * 0.1;
                ctx.globalAlpha = alpha;
                drawRect(ctx, 122, 120 + y, 12, 1, '#1f3310');
            }
            ctx.globalAlpha = 1;

            // 卫衣中间高光（圆柱体感）
            for(let y = 0; y < 90; y++) {
                const width = 14 - Math.abs(y - 45) * 0.1;
                const x = 100 - width / 2;
                ctx.globalAlpha = 0.4;
                drawRect(ctx, x, 125 + y, width, 1, '#35611c');
            }
            ctx.globalAlpha = 1;

            // === 卫衣上的血迹（更自然的形状）===
            // 左胸大块血迹
            drawEllipse(ctx, 78, 145, 8, 12, '#5a1a1a');
            drawEllipse(ctx, 80, 148, 6, 10, '#4a1010');
            drawEllipse(ctx, 78, 150, 5, 8, '#3d0d0d');

            // 血液流淌
            for(let i = 0; i < 20; i++) {
                const y = 158 + i;
                const width = 2 - i * 0.05;
                const x = 79 + Math.sin(i * 0.5) * 1;
                ctx.globalAlpha = Math.max(0.3, 1 - i * 0.04);
                drawRect(ctx, x, y, Math.max(1, width), 1, '#3d0d0d');
            }
            ctx.globalAlpha = 1;

            // 右侧溅射血迹
            drawEllipse(ctx, 115, 138, 5, 4, '#5a1a1a');
            drawEllipse(ctx, 118, 140, 4, 3, '#4a1010');
            drawEllipse(ctx, 120, 136, 2, 2, '#4a1010');
            drawEllipse(ctx, 112, 143, 3, 3, '#3d0d0d');

            // 中下部血迹
            drawEllipse(ctx, 95, 175, 7, 9, '#5a1a1a');
            drawEllipse(ctx, 96, 177, 5, 7, '#4a1010');
            drawEllipse(ctx, 95, 179, 4, 5, '#3d0d0d');

            // 小血滴
            drawCircle(ctx, 88, 190, 1.5, '#3d0d0d');
            drawCircle(ctx, 105, 185, 1, '#4a1010');
            drawCircle(ctx, 118, 175, 1.5, '#3d0d0d');

            // === 绳子（绑在背后，两侧可见）===
            // 左侧绳子
            for(let y = 0; y < 35; y++) {
                const x = 62 + Math.sin(y * 0.3) * 1;
                drawRect(ctx, x, 135 + y, 4, 1, '#4a3828');
                drawRect(ctx, x + 1, 135 + y, 2, 1, '#5a4838');
            }

            // 右侧绳子
            for(let y = 0; y < 35; y++) {
                const x = 134 + Math.sin(y * 0.3) * 1;
                drawRect(ctx, x, 135 + y, 4, 1, '#4a3828');
                drawRect(ctx, x + 1, 135 + y, 2, 1, '#5a4838');
            }
        }

        // ===== 绘制左轮手枪 =====
        function drawRevolver() {
            const canvas = document.getElementById('revolverCanvas');
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            // 枪管
            drawRect(ctx, 25, 20, 30, 10, '#0d0d0d');
            drawRect(ctx, 26, 21, 28, 8, '#1a1a1a');
            drawRect(ctx, 25, 22, 2, 6, '#000000');

            // 弹仓
            drawCircle(ctx, 58, 25, 8, '#1a1a1a');
            drawCircle(ctx, 58, 25, 6, '#2a2a2a');

            // 弹仓孔
            for(let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const x = 58 + Math.cos(angle) * 3;
                const y = 25 + Math.sin(angle) * 3;
                drawCircle(ctx, x, y, 1, '#0d0d0d');
            }

            // 扳机护圈
            drawRect(ctx, 58, 30, 10, 2, '#2a2a2a');
            drawRect(ctx, 58, 30, 2, 8, '#2a2a2a');
            drawRect(ctx, 66, 30, 2, 8, '#2a2a2a');

            // 扳机
            drawRect(ctx, 61, 33, 4, 5, '#3a3a3a');

            // 握把
            for(let i = 0; i < 8; i++) {
                const width = 12 - i * 1.2;
                drawRect(ctx, 63, 35 + i * 2, width, 2, '#1a1a1a');
            }

            // 握把纹理
            for(let i = 0; i < 6; i++) {
                drawRect(ctx, 65, 37 + i * 2, 6, 1, '#2a2a2a');
            }

            // 高光
            drawRect(ctx, 27, 22, 10, 1, '#3a3a3a');
            drawCircle(ctx, 56, 23, 2, '#3a3a3a');
        }

        // ===== 绘制玩家左手（在桌面上）=====
        function drawLeftHand() {
            const canvas = document.getElementById('leftHand');
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 手臂（渐变淡化，但较短因为手在桌上）
            for(let y = 0; y < 80; y++) {
                const alpha = Math.min(1, y / 50);
                const r = 139, g = 125, b = 107;
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                const width = 32 + y * 0.1;
                const x = 70 - width / 2;
                drawRect(ctx, x, y, width, 1);

                // 手臂阴影
                if(alpha > 0.3) {
                    ctx.fillStyle = `rgba(${r-20}, ${g-20}, ${b-20}, ${alpha * 0.6})`;
                    drawRect(ctx, x, y, 6, 1);
                }
            }

            // 手腕
            drawEllipse(ctx, 70, 95, 20, 12, '#8b7d6b');
            drawEllipse(ctx, 70, 96, 18, 10, '#9a8a75');

            // 手腕阴影
            drawEllipse(ctx, 70, 92, 18, 8, '#7a6d5f');

            // === 铁链（圆环形连接）===
            // 绘制链环
            function drawChainLink(x, y, size, alpha = 1) {
                ctx.globalAlpha = alpha;
                // 外圈
                ctx.strokeStyle = '#4a4a4a';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(x, y, size, size * 0.7, 0, 0, Math.PI * 2);
                ctx.stroke();

                // 内圈（亮部）
                ctx.strokeStyle = '#5a5a5a';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(x, y, size - 1, size * 0.7 - 1, 0, 0, Math.PI * 2);
                ctx.stroke();

                // 高光
                ctx.strokeStyle = '#6a6a6a';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(x - 1, y - 1, size - 2, size * 0.7 - 2, 0, Math.PI * 1.2, Math.PI * 1.8);
                ctx.stroke();

                ctx.globalAlpha = 1;
            }

            // 手腕上的主链环
            drawChainLink(70, 95, 8, 1);

            // 延伸的链环（一个套一个）
            drawChainLink(82, 95, 7, 0.95);
            drawChainLink(93, 95, 6.5, 0.85);
            drawChainLink(103, 95, 6, 0.7);
            drawChainLink(112, 95, 5.5, 0.5);
            drawChainLink(120, 95, 5, 0.3);

            // 手掌
            drawEllipse(ctx, 70, 135, 22, 28, '#8b7d6b');
            drawEllipse(ctx, 70, 136, 20, 26, '#9a8a75');

            // 手掌阴影
            for(let i = 0; i < 10; i++) {
                ctx.globalAlpha = 0.3 - i * 0.02;
                drawEllipse(ctx, 68, 130, 20 - i * 0.5, 26 - i * 0.5, '#7a6d5f');
            }
            ctx.globalAlpha = 1;

            // 手掌纹路
            ctx.strokeStyle = '#8a7a68';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(55, 143);
            ctx.quadraticCurveTo(70, 145, 85, 143);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(58, 152);
            ctx.quadraticCurveTo(70, 154, 82, 152);
            ctx.stroke();

            // === 拇指（有机形状）===
            drawEllipse(ctx, 45, 145, 8, 14, '#8b7d6b');
            drawEllipse(ctx, 45, 145, 7, 12, '#9a8a75');
            drawEllipse(ctx, 44, 142, 6, 10, '#7a6d5f');

            // 拇指关节
            drawRect(ctx, 42, 148, 6, 1, '#8a7a68');

            // === 手指（圆润有机）===
            // 食指
            for(let i = 0; i < 40; i++) {
                const width = 6 - i * 0.05;
                const y = 163 + i;
                drawEllipse(ctx, 57, y, width / 2, 0.5, '#8b7d6b');
            }
            drawEllipse(ctx, 57, 165, 3, 20, '#9a8a75');
            drawRect(ctx, 55, 178, 4, 1, '#8a7a68');
            drawRect(ctx, 55, 191, 4, 1, '#8a7a68');

            // 中指
            for(let i = 0; i < 45; i++) {
                const width = 6 - i * 0.04;
                const y = 163 + i;
                drawEllipse(ctx, 70, y, width / 2, 0.5, '#8b7d6b');
            }
            drawEllipse(ctx, 70, 165, 3, 22, '#9a8a75');
            drawRect(ctx, 68, 180, 4, 1, '#8a7a68');
            drawRect(ctx, 68, 195, 4, 1, '#8a7a68');

            // 无名指
            for(let i = 0; i < 40; i++) {
                const width = 6 - i * 0.05;
                const y = 163 + i;
                drawEllipse(ctx, 83, y, width / 2, 0.5, '#8b7d6b');
            }
            drawEllipse(ctx, 83, 165, 3, 20, '#9a8a75');
            drawRect(ctx, 81, 178, 4, 1, '#8a7a68');
            drawRect(ctx, 81, 191, 4, 1, '#8a7a68');

            // 小指
            for(let i = 0; i < 35; i++) {
                const width = 5 - i * 0.05;
                const y = 163 + i;
                drawEllipse(ctx, 94, y, width / 2, 0.5, '#8b7d6b');
            }
            drawEllipse(ctx, 94, 165, 2.5, 17, '#9a8a75');
            drawRect(ctx, 92, 175, 4, 1, '#8a7a68');
            drawRect(ctx, 92, 186, 4, 1, '#8a7a68');
        }

        // ===== 绘制玩家右手（在桌面上）=====
        function drawRightHand() {
            const canvas = document.getElementById('rightHand');
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 手臂（渐变淡化）
            for(let y = 0; y < 80; y++) {
                const alpha = Math.min(1, y / 50);
                const r = 139, g = 125, b = 107;
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                const width = 32 + y * 0.1;
                const x = 110 - width / 2;
                drawRect(ctx, x, y, width, 1);

                // 手臂阴影
                if(alpha > 0.3) {
                    ctx.fillStyle = `rgba(${r-20}, ${g-20}, ${b-20}, ${alpha * 0.6})`;
                    drawRect(ctx, x + width - 6, y, 6, 1);
                }
            }

            // 手腕
            drawEllipse(ctx, 110, 95, 20, 12, '#8b7d6b');
            drawEllipse(ctx, 110, 96, 18, 10, '#9a8a75');
            drawEllipse(ctx, 110, 92, 18, 8, '#7a6d5f');

            // === 铁链（圆环形连接）===
            function drawChainLink(x, y, size, alpha = 1) {
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = '#4a4a4a';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(x, y, size, size * 0.7, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = '#5a5a5a';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(x, y, size - 1, size * 0.7 - 1, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = '#6a6a6a';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(x - 1, y - 1, size - 2, size * 0.7 - 2, 0, Math.PI * 1.2, Math.PI * 1.8);
                ctx.stroke();

                ctx.globalAlpha = 1;
            }

            // 手腕上的主链环
            drawChainLink(110, 95, 8, 1);

            // 延伸的链环
            drawChainLink(98, 95, 7, 0.95);
            drawChainLink(87, 95, 6.5, 0.85);
            drawChainLink(77, 95, 6, 0.7);
            drawChainLink(68, 95, 5.5, 0.5);
            drawChainLink(60, 95, 5, 0.3);

            // 手掌
            drawEllipse(ctx, 110, 135, 22, 28, '#8b7d6b');
            drawEllipse(ctx, 110, 136, 20, 26, '#9a8a75');

            // 手掌阴影
            for(let i = 0; i < 10; i++) {
                ctx.globalAlpha = 0.3 - i * 0.02;
                drawEllipse(ctx, 112, 130, 20 - i * 0.5, 26 - i * 0.5, '#7a6d5f');
            }
            ctx.globalAlpha = 1;

            // 手掌纹路
            ctx.strokeStyle = '#8a7a68';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(95, 143);
            ctx.quadraticCurveTo(110, 145, 125, 143);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(98, 152);
            ctx.quadraticCurveTo(110, 154, 122, 152);
            ctx.stroke();

            // 拇指（右手在右侧）
            drawEllipse(ctx, 135, 145, 8, 14, '#8b7d6b');
            drawEllipse(ctx, 135, 145, 7, 12, '#9a8a75');
            drawEllipse(ctx, 136, 142, 6, 10, '#7a6d5f');
            drawRect(ctx, 132, 148, 6, 1, '#8a7a68');

            // 手指
            // 小指
            for(let i = 0; i < 35; i++) {
                const width = 5 - i * 0.05;
                const y = 163 + i;
                drawEllipse(ctx, 86, y, width / 2, 0.5, '#8b7d6b');
            }
            drawEllipse(ctx, 86, 165, 2.5, 17, '#9a8a75');
            drawRect(ctx, 84, 175, 4, 1, '#8a7a68');
            drawRect(ctx, 84, 186, 4, 1, '#8a7a68');

            // 无名指
            for(let i = 0; i < 40; i++) {
                const width = 6 - i * 0.05;
                const y = 163 + i;
                drawEllipse(ctx, 97, y, width / 2, 0.5, '#8b7d6b');
            }
            drawEllipse(ctx, 97, 165, 3, 20, '#9a8a75');
            drawRect(ctx, 95, 178, 4, 1, '#8a7a68');
            drawRect(ctx, 95, 191, 4, 1, '#8a7a68');

            // 中指
            for(let i = 0; i < 45; i++) {
                const width = 6 - i * 0.04;
                const y = 163 + i;
                drawEllipse(ctx, 110, y, width / 2, 0.5, '#8b7d6b');
            }
            drawEllipse(ctx, 110, 165, 3, 22, '#9a8a75');
            drawRect(ctx, 108, 180, 4, 1, '#8a7a68');
            drawRect(ctx, 108, 195, 4, 1, '#8a7a68');

            // 食指
            for(let i = 0; i < 40; i++) {
                const width = 6 - i * 0.05;
                const y = 163 + i;
                drawEllipse(ctx, 123, y, width / 2, 0.5, '#8b7d6b');
            }
            drawEllipse(ctx, 123, 165, 3, 20, '#9a8a75');
            drawRect(ctx, 121, 178, 4, 1, '#8a7a68');
            drawRect(ctx, 121, 191, 4, 1, '#8a7a68');
        }

        // 初始化绘制所有元素
        drawOppositeCharacter();
        drawRevolver();
        drawLeftHand();
        drawRightHand();

        // 缩放画布以获得像素化效果
        document.querySelectorAll('.pixel-canvas').forEach(canvas => {
            canvas.style.width = (canvas.width * PIXEL_SIZE) + 'px';
            canvas.style.height = (canvas.height * PIXEL_SIZE) + 'px';
        });
    </script>
</body>
</html>
