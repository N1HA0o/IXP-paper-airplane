<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白纸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #f5f5dc; /* 纯米色背景 */
            font-family: sans-serif;
        }

        .scene {
            width: 100%;
            height: 100%;
            position: relative;
            perspective: 800px;
            perspective-origin: 50% 50%;
        }

        /* 超大平面 - 向四周无限延伸 */
        .plane {
            position: absolute;
            width: 5000px;
            height: 5000px;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            transform:
                translateX(-50%)
                translateY(-50%)
                translateZ(-1000px)
                rotateX(60deg);
        }

        /* 平面表面 - 从中心向四周淡化 */
        .plane-surface {
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle at center,
                rgba(173, 216, 230, 1) 0%,      /* 中心纯浅蓝色 */
                rgba(173, 216, 230, 0.9) 15%,   /* 靠近中心 */
                rgba(173, 216, 230, 0.7) 30%,   /* 开始淡化 */
                rgba(173, 216, 230, 0.4) 50%,   /* 继续淡化 */
                rgba(173, 216, 230, 0.2) 70%,   /* 更远更淡 */
                rgba(173, 216, 230, 0) 100%     /* 边缘完全透明 */
            );
            position: relative;
        }

        /* 白纸 - 位于平面中心 */
        .paper {
            position: absolute;
            width: 300px;
            height: 400px;
            background: #ffffff; /* 纯白色 */
            left: 50%;
            top: 50%;
            transform:
                translateX(-50%)
                translateY(-50%)
                rotateX(-60deg);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.15),
                0 10px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="plane">
            <div class="plane-surface">
                <div class="paper"></div>
            </div>
        </div>
    </div>
</body>
</html>
