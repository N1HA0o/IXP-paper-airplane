<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Airplane Journey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            font-family: 'Arial', sans-serif;
        }

        .scene {
            width: 100%;
            height: 100%;
            position: relative;
            perspective: 1200px;
            perspective-origin: 50% 50%;
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .world {
            position: absolute;
            width: 8000px;
            height: 5000px;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            transform:
                translateX(-50%)
                translateY(-50%)
                translateZ(-1200px)
                rotateX(65deg);
            transition: all 3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ground {
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                rgba(173, 216, 230, 1) 0%,
                rgba(173, 216, 230, 0.95) 10%,
                rgba(173, 216, 230, 0.8) 25%,
                rgba(173, 216, 230, 0.5) 45%,
                rgba(173, 216, 230, 0.25) 65%,
                rgba(173, 216, 230, 0) 100%
            );
            position: relative;
        }

        /* Paper container - 3D but no thickness */
        .paper-container {
            position: absolute;
            width: 300px;
            height: 400px;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            transform:
                translateX(-50%)
                translateY(-50%)
                rotateX(-65deg);
            cursor: pointer;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .paper-container.folding {
            cursor: default;
        }

        /* Base paper - 3D, no thickness */
        .paper {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        /* Left half of paper */
        .paper-left {
            position: absolute;
            width: 50%;
            height: 100%;
            left: 0;
            top: 0;
            background: #ffffff;
            transform-style: preserve-3d;
            transform-origin: right center;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2),
                0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Right half of paper */
        .paper-right {
            position: absolute;
            width: 50%;
            height: 100%;
            right: 0;
            top: 0;
            background: #ffffff;
            transform-style: preserve-3d;
            transform-origin: left center;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2),
                0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Center line indicator */
        .center-line {
            position: absolute;
            width: 2px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            background: repeating-linear-gradient(
                to bottom,
                rgba(200, 200, 200, 0) 0px,
                rgba(200, 200, 200, 0) 5px,
                rgba(200, 200, 200, 0.6) 5px,
                rgba(200, 200, 200, 0.6) 10px
            );
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
            z-index: 10;
        }

        .center-line.visible {
            opacity: 1;
        }

        /* Top left triangle - Step 2 */
        .top-left-fold {
            position: absolute;
            width: 50%;
            height: 50%;
            left: 0;
            top: 0;
            background: #ffffff;
            transform-style: preserve-3d;
            transform-origin: 50% 100%;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            box-shadow: 3px 3px 12px rgba(0, 0, 0, 0.2);
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }

        /* Top right triangle - Step 3 */
        .top-right-fold {
            position: absolute;
            width: 50%;
            height: 50%;
            right: 0;
            top: 0;
            background: #ffffff;
            transform-style: preserve-3d;
            transform-origin: 0% 100%;
            clip-path: polygon(0 0, 100% 0, 0 100%);
            box-shadow: -3px 3px 12px rgba(0, 0, 0, 0.2);
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }

        /* Wing left - Step 5 */
        .wing-left {
            position: absolute;
            width: 50%;
            height: 100%;
            left: 0;
            top: 0;
            background: linear-gradient(to right, #ffffff 0%, #fafafa 100%);
            transform-style: preserve-3d;
            transform-origin: right center;
            box-shadow: -2px 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            z-index: 1;
        }

        .wing-left.visible {
            opacity: 1;
        }

        /* Wing right - Step 5 */
        .wing-right {
            position: absolute;
            width: 50%;
            height: 100%;
            right: 0;
            top: 0;
            background: linear-gradient(to left, #ffffff 0%, #fafafa 100%);
            transform-style: preserve-3d;
            transform-origin: left center;
            box-shadow: 2px 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            z-index: 1;
        }

        .wing-right.visible {
            opacity: 1;
        }

        /* Choice buttons - Left */
        .choice-left {
            position: fixed;
            left: 80px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 100;
        }

        .choice-left.visible {
            display: flex;
            opacity: 1;
        }

        .choice-left:hover {
            transform: translateY(-50%) translateX(-10px);
        }

        /* Choice buttons - Right */
        .choice-right {
            position: fixed;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 100;
        }

        .choice-right.visible {
            display: flex;
            opacity: 1;
        }

        .choice-right:hover {
            transform: translateY(-50%) translateX(10px);
        }

        /* Arrow */
        .arrow {
            width: 60px;
            height: 60px;
            color: white;
            font-size: 48px;
            font-weight: 300;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            animation: float-arrow 2s ease-in-out infinite;
        }

        @keyframes float-arrow {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-8px); }
        }

        .choice-right .arrow {
            animation: float-arrow-right 2s ease-in-out infinite;
        }

        @keyframes float-arrow-right {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(8px); }
        }

        /* Choice text */
        .choice-text {
            color: white;
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 3px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 25px;
            border-radius: 25px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Pigeons */
        .pigeons {
            position: absolute;
            left: 45%;
            top: 30%;
            transform-style: preserve-3d;
            opacity: 0;
            transform: scale(0.2) translateZ(-2000px);
            transition: all 6s cubic-bezier(0.2, 0, 0.3, 1);
        }

        .pigeons.visible {
            opacity: 1;
            transform: scale(1.5) translateZ(200px);
        }

        .pigeon {
            position: absolute;
            width: 40px;
            height: 30px;
            background: white;
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            animation: fly 2s ease-in-out infinite;
        }

        .pigeon::before,
        .pigeon::after {
            content: '';
            position: absolute;
            width: 35px;
            height: 12px;
            background: white;
            border-radius: 50%;
            top: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .pigeon::before {
            left: -30px;
            transform-origin: right center;
            animation: wing-left 0.5s ease-in-out infinite;
        }

        .pigeon::after {
            right: -30px;
            transform-origin: left center;
            animation: wing-right 0.5s ease-in-out infinite;
        }

        @keyframes fly {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes wing-left {
            0%, 100% { transform: rotateZ(-10deg); }
            50% { transform: rotateZ(-30deg); }
        }

        @keyframes wing-right {
            0%, 100% { transform: rotateZ(10deg); }
            50% { transform: rotateZ(30deg); }
        }

        /* Hot air balloon */
        .hot-air-balloon {
            position: absolute;
            right: 40%;
            bottom: -500px;
            transform-style: preserve-3d;
            opacity: 0;
            transition: all 5s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .hot-air-balloon.visible {
            opacity: 1;
            bottom: 30%;
        }

        /* Balloon sphere */
        .balloon-sphere {
            position: relative;
            width: 200px;
            height: 240px;
            transform-style: preserve-3d;
            animation: float-balloon 4s ease-in-out infinite;
        }

        @keyframes float-balloon {
            0%, 100% { transform: translateY(0px) rotateY(0deg); }
            50% { transform: translateY(-25px) rotateY(5deg); }
        }

        /* Sphere layers */
        .balloon-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            transform-style: preserve-3d;
        }

        .balloon-layer-1 {
            background: linear-gradient(135deg,
                #dc143c 0%,
                #ff4757 25%,
                #ff6b6b 50%,
                #ee5a6f 75%,
                #c91f37 100%);
            transform: translateZ(30px);
            box-shadow:
                inset -10px -20px 30px rgba(0, 0, 0, 0.2),
                inset 10px 10px 20px rgba(255, 255, 255, 0.3),
                0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .balloon-layer-2 {
            background: linear-gradient(90deg,
                rgba(255, 255, 255, 0.3) 0%,
                transparent 50%,
                rgba(0, 0, 0, 0.1) 100%);
            transform: translateZ(35px);
        }

        /* Balloon stripes */
        .balloon-stripe {
            position: absolute;
            width: 100%;
            height: 15%;
            left: 0;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        .balloon-stripe:nth-child(1) { top: 20%; }
        .balloon-stripe:nth-child(2) { top: 40%; }
        .balloon-stripe:nth-child(3) { top: 60%; }

        /* Ropes */
        .balloon-ropes {
            position: absolute;
            width: 100%;
            height: 80px;
            top: 100%;
            left: 0;
            transform-style: preserve-3d;
        }

        .rope {
            position: absolute;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom,
                #654321 0%,
                #8B4513 50%,
                #654321 100%);
            transform-origin: top center;
            box-shadow: 1px 0 2px rgba(0, 0, 0, 0.3);
        }

        .rope:nth-child(1) {
            left: 30%;
            transform: rotateZ(-3deg);
        }

        .rope:nth-child(2) {
            left: 50%;
            transform: translateX(-50%);
        }

        .rope:nth-child(3) {
            right: 30%;
            transform: rotateZ(3deg);
        }

        /* Basket */
        .balloon-basket {
            position: absolute;
            width: 80px;
            height: 60px;
            left: 50%;
            top: 100%;
            transform: translateX(-50%);
            margin-top: 80px;
            background: linear-gradient(135deg,
                #8B4513 0%,
                #A0522D 50%,
                #654321 100%);
            border-radius: 0 0 12px 12px;
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, 0.3),
                inset -2px -2px 5px rgba(0, 0, 0, 0.3),
                0 10px 25px rgba(0, 0, 0, 0.4);
            transform-style: preserve-3d;
        }

        /* Basket weave */
        .basket-weave {
            position: absolute;
            width: 100%;
            height: 3px;
            background: rgba(0, 0, 0, 0.2);
            left: 0;
        }

        .basket-weave:nth-child(1) { top: 20%; }
        .basket-weave:nth-child(2) { top: 40%; }
        .basket-weave:nth-child(3) { top: 60%; }
        .basket-weave:nth-child(4) { top: 80%; }

        /* Basket rim */
        .basket-rim {
            position: absolute;
            width: 100%;
            height: 8px;
            top: -4px;
            background: #654321;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        /* Hint text */
        .hint {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.95);
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
            opacity: 0.9;
            pointer-events: none;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            transition: opacity 0.5s;
            background: rgba(0, 0, 0, 0.15);
            padding: 15px 35px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
        }

        /* Step counter */
        .step-counter {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 30px;
            border-radius: 25px;
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 50;
        }

        .step-counter.visible {
            opacity: 0.9;
        }

        /* Scene description */
        .scene-description {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 3px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
            transition: opacity 1s ease-out;
            z-index: 50;
            max-width: 80%;
            background: rgba(0, 0, 0, 0.2);
            padding: 25px 45px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .scene-description.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="step-counter" id="stepCounter">Step 1 / 5</div>
    <div class="hint" id="hint">Click the paper to start folding</div>
    <div class="scene-description" id="sceneDesc"></div>

    <!-- Left choice -->
    <div class="choice-left" id="choiceLeft">
        <div class="arrow">←</div>
        <div class="choice-text">Fly Left</div>
    </div>

    <!-- Right choice -->
    <div class="choice-right" id="choiceRight">
        <div class="arrow">→</div>
        <div class="choice-text">Fly Right</div>
    </div>

    <div class="scene" id="scene">
        <div class="world" id="world">
            <div class="ground">
                <!-- Paper and airplane -->
                <div class="paper-container" id="paperContainer">
                    <div class="paper" id="paper">
                        <!-- Center line -->
                        <div class="center-line" id="centerLine"></div>

                        <!-- Left and right halves -->
                        <div class="paper-left" id="paperLeft"></div>
                        <div class="paper-right" id="paperRight"></div>

                        <!-- Top folds -->
                        <div class="top-left-fold" id="topLeftFold"></div>
                        <div class="top-right-fold" id="topRightFold"></div>

                        <!-- Wings -->
                        <div class="wing-left" id="wingLeft"></div>
                        <div class="wing-right" id="wingRight"></div>
                    </div>
                </div>

                <!-- Pigeons -->
                <div class="pigeons" id="pigeons"></div>

                <!-- Hot air balloon -->
                <div class="hot-air-balloon" id="balloon">
                    <div class="balloon-sphere">
                        <div class="balloon-layer balloon-layer-1">
                            <div class="balloon-stripe"></div>
                            <div class="balloon-stripe"></div>
                            <div class="balloon-stripe"></div>
                        </div>
                        <div class="balloon-layer balloon-layer-2"></div>
                    </div>
                    <div class="balloon-ropes">
                        <div class="rope"></div>
                        <div class="rope"></div>
                        <div class="rope"></div>
                    </div>
                    <div class="balloon-basket">
                        <div class="basket-rim"></div>
                        <div class="basket-weave"></div>
                        <div class="basket-weave"></div>
                        <div class="basket-weave"></div>
                        <div class="basket-weave"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        let isAnimating = false;
        let gameState = 'folding'; // folding, flying

        const el = {
            scene: document.getElementById('scene'),
            world: document.getElementById('world'),
            container: document.getElementById('paperContainer'),
            paper: document.getElementById('paper'),
            paperLeft: document.getElementById('paperLeft'),
            paperRight: document.getElementById('paperRight'),
            centerLine: document.getElementById('centerLine'),
            topLeftFold: document.getElementById('topLeftFold'),
            topRightFold: document.getElementById('topRightFold'),
            wingLeft: document.getElementById('wingLeft'),
            wingRight: document.getElementById('wingRight'),
            hint: document.getElementById('hint'),
            stepCounter: document.getElementById('stepCounter'),
            choiceLeft: document.getElementById('choiceLeft'),
            choiceRight: document.getElementById('choiceRight'),
            pigeons: document.getElementById('pigeons'),
            balloon: document.getElementById('balloon'),
            sceneDesc: document.getElementById('sceneDesc')
        };

        // Step hints
        const stepHints = [
            "Click to create center line",
            "Click to fold top-left corner",
            "Click to fold top-right corner",
            "Click to fold along center",
            "Click to spread wings",
            "Choose your flight direction"
        ];

        // Create pigeons
        function createPigeons() {
            const positions = [
                { x: 0, y: 0, delay: 0 },
                { x: 90, y: -40, delay: 0.2 },
                { x: -80, y: 25, delay: 0.1 },
                { x: 170, y: 15, delay: 0.3 },
                { x: -160, y: -25, delay: 0.15 },
                { x: 70, y: 70, delay: 0.25 },
                { x: -60, y: -70, delay: 0.05 },
                { x: 130, y: -60, delay: 0.35 }
            ];

            positions.forEach(pos => {
                const pigeon = document.createElement('div');
                pigeon.className = 'pigeon';
                pigeon.style.left = pos.x + 'px';
                pigeon.style.top = pos.y + 'px';
                pigeon.style.animationDelay = pos.delay + 's';
                el.pigeons.appendChild(pigeon);
            });
        }

        // Update UI
        function updateUI() {
            if (currentStep < 5) {
                el.stepCounter.textContent = `Step ${currentStep + 1} / 5`;
                el.stepCounter.classList.add('visible');
                el.hint.textContent = stepHints[currentStep];
            } else {
                el.stepCounter.classList.remove('visible');
                el.hint.textContent = stepHints[5];
            }
        }

        // Folding steps
        const foldSteps = [
            // Step 1: Show center line
            function step1() {
                isAnimating = true;
                el.container.classList.add('folding');

                // Paper halves slightly fold inward then return
                el.paperLeft.style.transform = 'rotateY(15deg)';
                el.paperRight.style.transform = 'rotateY(-15deg)';

                setTimeout(() => {
                    el.paperLeft.style.transform = 'rotateY(0deg)';
                    el.paperRight.style.transform = 'rotateY(0deg)';
                    el.centerLine.classList.add('visible');
                }, 600);

                setTimeout(() => {
                    isAnimating = false;
                    el.container.classList.remove('folding');
                    currentStep++;
                    updateUI();
                }, 1200);
            },

            // Step 2: Fold top-left corner
            function step2() {
                isAnimating = true;
                el.container.classList.add('folding');

                // Fold top-left triangle down toward center
                el.topLeftFold.style.transform = 'rotateX(180deg)';

                setTimeout(() => {
                    isAnimating = false;
                    el.container.classList.remove('folding');
                    currentStep++;
                    updateUI();
                }, 1200);
            },

            // Step 3: Fold top-right corner
            function step3() {
                isAnimating = true;
                el.container.classList.add('folding');

                // Fold top-right triangle down toward center
                el.topRightFold.style.transform = 'rotateX(180deg)';

                setTimeout(() => {
                    isAnimating = false;
                    el.container.classList.remove('folding');
                    currentStep++;
                    updateUI();
                }, 1200);
            },

            // Step 4: Fold along center line
            function step4() {
                isAnimating = true;
                el.container.classList.add('folding');

                // Entire airplane folds along center
                el.paperLeft.style.transform = 'rotateY(-90deg)';
                el.paperRight.style.transform = 'rotateY(0deg)';
                el.topLeftFold.style.transform = 'rotateX(180deg) rotateY(-90deg)';

                // Hide center line
                el.centerLine.style.opacity = '0';

                // Rotate container to show side view
                setTimeout(() => {
                    el.container.style.transform = `
                        translateX(-50%)
                        translateY(-50%)
                        rotateX(-65deg)
                        rotateY(90deg)
                    `;
                }, 300);

                setTimeout(() => {
                    isAnimating = false;
                    el.container.classList.remove('folding');
                    currentStep++;
                    updateUI();
                }, 1200);
            },

            // Step 5: Spread wings
            function step5() {
                isAnimating = true;
                el.container.classList.add('folding');

                // Hide paper halves, show wings
                el.paperLeft.style.opacity = '0';
                el.paperRight.style.opacity = '0';
                el.topLeftFold.style.opacity = '0';
                el.topRightFold.style.opacity = '0';

                setTimeout(() => {
                    el.wingLeft.classList.add('visible');
                    el.wingRight.classList.add('visible');

                    // Spread wings outward
                    el.wingLeft.style.transform = 'rotateZ(-25deg)';
                    el.wingRight.style.transform = 'rotateZ(25deg)';
                }, 300);

                // Zoom in camera
                setTimeout(() => {
                    el.scene.style.perspective = '700px';
                    el.world.style.transform = `
                        translateX(-50%)
                        translateY(-50%)
                        translateZ(-500px)
                        rotateX(55deg)
                    `;
                }, 600);

                setTimeout(() => {
                    isAnimating = false;
                    el.container.classList.remove('folding');
                    currentStep++;
                    updateUI();

                    // Show flight choices
                    gameState = 'flying';
                    el.choiceLeft.classList.add('visible');
                    el.choiceRight.classList.add('visible');
                }, 1800);
            }
        ];

        // Handle click
        function handleClick() {
            if (isAnimating || gameState !== 'folding') return;

            if (currentStep < foldSteps.length) {
                foldSteps[currentStep]();
            }
        }

        // Fly left - Meet pigeons
        function flyLeft() {
            if (gameState !== 'flying') return;
            gameState = 'done';

            el.choiceLeft.classList.remove('visible');
            el.choiceRight.classList.remove('visible');
            el.hint.style.opacity = '0';

            // Airplane turns left
            el.container.style.transform = `
                translateX(-50%)
                translateY(-50%)
                rotateX(-50deg)
                rotateY(0deg)
                scale(1.2)
            `;

            // Camera follows
            setTimeout(() => {
                el.scene.style.perspective = '900px';
                el.world.style.transform = `
                    translateX(-50%)
                    translateY(-50%)
                    translateZ(-400px)
                    rotateX(50deg)
                    rotateY(-20deg)
                `;
            }, 500);

            // Pigeons approach
            setTimeout(() => {
                el.pigeons.classList.add('visible');
                el.sceneDesc.textContent = 'A flock of pigeons approaches from afar';
                el.sceneDesc.classList.add('visible');
            }, 1500);

            setTimeout(() => {
                el.sceneDesc.style.opacity = '0';
            }, 7000);
        }

        // Fly right - Meet hot air balloon
        function flyRight() {
            if (gameState !== 'flying') return;
            gameState = 'done';

            el.choiceLeft.classList.remove('visible');
            el.choiceRight.classList.remove('visible');
            el.hint.style.opacity = '0';

            // Airplane turns right
            el.container.style.transform = `
                translateX(-50%)
                translateY(-50%)
                rotateX(-50deg)
                rotateY(180deg)
                scale(1.2)
            `;

            // Camera follows
            setTimeout(() => {
                el.scene.style.perspective = '900px';
                el.world.style.transform = `
                    translateX(-50%)
                    translateY(-50%)
                    translateZ(-400px)
                    rotateX(50deg)
                    rotateY(20deg)
                `;
            }, 500);

            // Balloon rises
            setTimeout(() => {
                el.balloon.classList.add('visible');
                el.sceneDesc.textContent = 'A red hot air balloon rises from below';
                el.sceneDesc.classList.add('visible');
            }, 1500);

            setTimeout(() => {
                el.sceneDesc.style.opacity = '0';
            }, 7000);
        }

        // Event listeners
        el.container.addEventListener('click', handleClick);
        el.choiceLeft.addEventListener('click', flyLeft);
        el.choiceRight.addEventListener('click', flyRight);

        // Initialize
        createPigeons();
        updateUI();
    </script>
</body>
</html>
