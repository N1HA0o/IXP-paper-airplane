<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Airplane Folding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Main scene container */
        .scene {
            width: 100%;
            height: 100%;
            perspective: 1500px;
            perspective-origin: 50% 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Paper container - 3D space */
        .paper-container {
            position: relative;
            width: 400px;
            height: 560px;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .paper-container.folding {
            cursor: wait;
        }

        .paper-container.complete {
            cursor: default;
        }

        /* Base paper - no thickness */
        .paper {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        /* Left half of paper */
        .paper-left {
            position: absolute;
            width: 50%;
            height: 100%;
            left: 0;
            top: 0;
            background: #ffffff;
            transform-style: preserve-3d;
            transform-origin: right center;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.3),
                inset 0 0 0 1px rgba(0, 0, 0, 0.05);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Right half of paper */
        .paper-right {
            position: absolute;
            width: 50%;
            height: 100%;
            right: 0;
            top: 0;
            background: #ffffff;
            transform-style: preserve-3d;
            transform-origin: left center;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.3),
                inset 0 0 0 1px rgba(0, 0, 0, 0.05);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Center fold line */
        .center-line {
            position: absolute;
            width: 2px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-1px);
            background: repeating-linear-gradient(
                to bottom,
                rgba(150, 150, 150, 0) 0px,
                rgba(150, 150, 150, 0) 8px,
                rgba(150, 150, 150, 0.5) 8px,
                rgba(150, 150, 150, 0.5) 16px
            );
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            z-index: 10;
        }

        .center-line.visible {
            opacity: 1;
        }

        /* Top-left triangle fold */
        .fold-top-left {
            position: absolute;
            width: 50%;
            height: 35%;
            left: 0;
            top: 0;
            background: #ffffff;
            transform-style: preserve-3d;
            transform-origin: 100% 100%;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }

        /* Top-right triangle fold */
        .fold-top-right {
            position: absolute;
            width: 50%;
            height: 35%;
            right: 0;
            top: 0;
            background: #ffffff;
            transform-style: preserve-3d;
            transform-origin: 0% 100%;
            clip-path: polygon(0 0, 100% 0, 0 100%);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }

        /* Wings */
        .wing-left {
            position: absolute;
            width: 200px;
            height: 100%;
            left: 0;
            top: 0;
            background: linear-gradient(to right, #ffffff 0%, #f8f8f8 100%);
            transform-style: preserve-3d;
            transform-origin: right center;
            box-shadow: -3px 5px 20px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(100% 0, 100% 100%, 0 100%, 30% 0);
        }

        .wing-left.visible {
            opacity: 1;
        }

        .wing-right {
            position: absolute;
            width: 200px;
            height: 100%;
            right: 0;
            top: 0;
            background: linear-gradient(to left, #ffffff 0%, #f8f8f8 100%);
            transform-style: preserve-3d;
            transform-origin: left center;
            box-shadow: 3px 5px 20px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(0 0, 0 100%, 100% 100%, 70% 0);
        }

        .wing-right.visible {
            opacity: 1;
        }

        /* Step counter */
        .step-counter {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 50px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            font-size: 24px;
            font-weight: 600;
            color: #667eea;
            letter-spacing: 2px;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .step-counter .current {
            font-size: 36px;
            color: #764ba2;
        }

        /* Instruction text */
        .instruction {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 1.5px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
            z-index: 100;
            transition: opacity 0.3s ease;
            max-width: 80%;
        }

        /* Fold guide lines */
        .guide-line {
            position: absolute;
            background: rgba(255, 200, 0, 0.6);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 10px rgba(255, 200, 0, 0.8);
        }

        .guide-line.visible {
            opacity: 1;
        }

        /* Diagonal guide for step 2 & 3 */
        .diagonal-left {
            width: 2px;
            height: 250px;
            left: 0;
            top: 0;
            transform-origin: top left;
            transform: rotate(35deg);
        }

        .diagonal-right {
            width: 2px;
            height: 250px;
            right: 0;
            top: 0;
            transform-origin: top right;
            transform: rotate(-35deg);
        }

        /* Success message */
        .success-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.98);
            padding: 50px 70px;
            border-radius: 30px;
            box-shadow: 0 15px 60px rgba(0, 0, 0, 0.4);
            font-size: 32px;
            font-weight: 600;
            color: #667eea;
            text-align: center;
            z-index: 200;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .success-message.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .success-message .emoji {
            font-size: 64px;
            margin-bottom: 20px;
        }

        /* Restart button */
        .restart-button {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: white;
            color: #667eea;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .restart-button.show {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }

        .restart-button:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="step-counter" id="stepCounter">
        <span class="current">Step 1</span> / 5
    </div>

    <div class="instruction" id="instruction">
        Click the paper to fold it in half and create a center line
    </div>

    <div class="scene" id="scene">
        <div class="paper-container" id="paperContainer">
            <div class="paper" id="paper">
                <!-- Center line -->
                <div class="center-line" id="centerLine"></div>

                <!-- Guide lines -->
                <div class="guide-line diagonal-left" id="guideLeft"></div>
                <div class="guide-line diagonal-right" id="guideRight"></div>

                <!-- Paper halves -->
                <div class="paper-left" id="paperLeft"></div>
                <div class="paper-right" id="paperRight"></div>

                <!-- Top fold triangles -->
                <div class="fold-top-left" id="foldTopLeft"></div>
                <div class="fold-top-right" id="foldTopRight"></div>

                <!-- Wings -->
                <div class="wing-left" id="wingLeft"></div>
                <div class="wing-right" id="wingRight"></div>
            </div>
        </div>
    </div>

    <div class="success-message" id="successMessage">
        <div class="emoji">✈️</div>
        Paper Airplane Complete!
    </div>

    <div class="restart-button" id="restartButton">
        Fold Another Plane
    </div>

    <script>
        let currentStep = 0;
        let isAnimating = false;

        const el = {
            container: document.getElementById('paperContainer'),
            paper: document.getElementById('paper'),
            paperLeft: document.getElementById('paperLeft'),
            paperRight: document.getElementById('paperRight'),
            centerLine: document.getElementById('centerLine'),
            guideLeft: document.getElementById('guideLeft'),
            guideRight: document.getElementById('guideRight'),
            foldTopLeft: document.getElementById('foldTopLeft'),
            foldTopRight: document.getElementById('foldTopRight'),
            wingLeft: document.getElementById('wingLeft'),
            wingRight: document.getElementById('wingRight'),
            stepCounter: document.getElementById('stepCounter'),
            instruction: document.getElementById('instruction'),
            successMessage: document.getElementById('successMessage'),
            restartButton: document.getElementById('restartButton')
        };

        // Step instructions
        const instructions = [
            "Click the paper to fold it in half and create a center line",
            "Click to fold the top-left corner to the center",
            "Click to fold the top-right corner to the center",
            "Click to fold the airplane in half along the center",
            "Click to fold out the wings",
            "Perfect! Your paper airplane is ready to fly!"
        ];

        // Update UI
        function updateUI() {
            if (currentStep < 5) {
                el.stepCounter.innerHTML = `<span class="current">Step ${currentStep + 1}</span> / 5`;
                el.instruction.textContent = instructions[currentStep];
            } else {
                el.stepCounter.style.opacity = '0';
                el.instruction.style.opacity = '0';
            }
        }

        // Folding steps
        const foldSteps = [
            // Step 1: Create center line by folding in half
            function step1() {
                isAnimating = true;
                el.container.classList.add('folding');

                // Fold halves toward center
                el.paperLeft.style.transform = 'rotateY(90deg)';
                el.paperRight.style.transform = 'rotateY(-90deg)';

                setTimeout(() => {
                    // Unfold to show crease
                    el.paperLeft.style.transform = 'rotateY(0deg)';
                    el.paperRight.style.transform = 'rotateY(0deg)';
                    el.centerLine.classList.add('visible');
                }, 500);

                setTimeout(() => {
                    isAnimating = false;
                    el.container.classList.remove('folding');
                    currentStep++;
                    updateUI();
                }, 1000);
            },

            // Step 2: Fold top-left corner to center
            function step2() {
                isAnimating = true;
                el.container.classList.add('folding');

                // Show guide line briefly
                el.guideLeft.classList.add('visible');

                setTimeout(() => {
                    el.guideLeft.classList.remove('visible');
                    // Fold top-left triangle down
                    el.foldTopLeft.style.transform = 'rotateX(180deg)';
                }, 300);

                setTimeout(() => {
                    isAnimating = false;
                    el.container.classList.remove('folding');
                    currentStep++;
                    updateUI();
                }, 1000);
            },

            // Step 3: Fold top-right corner to center
            function step3() {
                isAnimating = true;
                el.container.classList.add('folding');

                // Show guide line briefly
                el.guideRight.classList.add('visible');

                setTimeout(() => {
                    el.guideRight.classList.remove('visible');
                    // Fold top-right triangle down
                    el.foldTopRight.style.transform = 'rotateX(180deg)';
                }, 300);

                setTimeout(() => {
                    isAnimating = false;
                    el.container.classList.remove('folding');
                    currentStep++;
                    updateUI();
                }, 1000);
            },

            // Step 4: Fold in half along center line
            function step4() {
                isAnimating = true;
                el.container.classList.add('folding');

                // Fold left half over right
                el.paperLeft.style.transform = 'rotateY(-180deg)';
                el.foldTopLeft.style.transform = 'rotateX(180deg) rotateY(-180deg)';

                // Hide center line
                el.centerLine.style.opacity = '0';

                // Rotate container to show side view
                setTimeout(() => {
                    el.container.style.transform = 'rotateY(90deg) rotateZ(-5deg)';
                }, 200);

                setTimeout(() => {
                    isAnimating = false;
                    el.container.classList.remove('folding');
                    currentStep++;
                    updateUI();
                }, 1000);
            },

            // Step 5: Fold out wings
            function step5() {
                isAnimating = true;
                el.container.classList.add('folding');

                // Hide paper elements
                setTimeout(() => {
                    el.paperLeft.style.opacity = '0';
                    el.paperRight.style.opacity = '0';
                    el.foldTopLeft.style.opacity = '0';
                    el.foldTopRight.style.opacity = '0';
                }, 100);

                // Show and spread wings
                setTimeout(() => {
                    el.wingLeft.classList.add('visible');
                    el.wingRight.classList.add('visible');
                    el.wingLeft.style.transform = 'rotateZ(-30deg)';
                    el.wingRight.style.transform = 'rotateZ(30deg)';
                }, 400);

                // Final rotation for better view
                setTimeout(() => {
                    el.container.style.transform = 'rotateY(100deg) rotateZ(-8deg) rotateX(10deg)';
                }, 600);

                setTimeout(() => {
                    isAnimating = false;
                    el.container.classList.add('complete');
                    currentStep++;
                    updateUI();

                    // Show success message
                    setTimeout(() => {
                        el.successMessage.classList.add('show');
                        el.restartButton.classList.add('show');
                    }, 300);
                }, 1000);
            }
        ];

        // Handle click
        function handleClick() {
            if (isAnimating || currentStep >= 5) return;

            if (currentStep < foldSteps.length) {
                foldSteps[currentStep]();
            }
        }

        // Restart
        function restart() {
            location.reload();
        }

        // Event listeners
        el.container.addEventListener('click', handleClick);
        el.restartButton.addEventListener('click', restart);

        // Initialize
        updateUI();
    </script>
</body>
</html>
